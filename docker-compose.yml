services:
  database:
    image: postgres:16-alpine
    container_name: secure-vault-db
    env_file:
      - ./database/.env
    volumes:
      # PostgreSQL data persistence
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: secure-vault-redis
    volumes:
      - redis_data:/data
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    image: apache/apisix:3.14.0-debian
    container_name: secure-vault-api-gateway
    volumes:
      - ./api-gateway/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./api-gateway/conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - backend
      - redis
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    restart: unless-stopped

  backend:
    build:
      context: ./secure-vault-backend
      dockerfile: Dockerfile
    image: secure-vault-backend:local
    container_name: secure-vault-backend
    # Optionally override the default command to run the Django server
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./secure-vault-backend/.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ./secure-vault-frontend
      dockerfile: Dockerfile
    image: secure-vault-frontend:local
    container_name: secure-vault-frontend
    volumes:
      - ./secure-vault-frontend:/app
      - /app/node_modules
    env_file:
      - ./secure-vault-frontend/.env
    depends_on:
      - backend
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: secure-vault-nginx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./nginx/.env
    volumes:
      - ./nginx/dev.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - secure-vault-network
      - secure-vault-network-monitoring
    restart: unless-stopped

  nagios:
    build:
      context: ./nagios
      dockerfile: Dockerfile
    image: secure-vault-nagios:local
    container_name: secure-vault-nagios
    ports:
      - "8080:80"
    profiles:
      - monitoring
    env_file:
      - ./nagios/.env
    volumes:
      - ./nagios/config:/etc/nagios:ro
      - ./nagios/plugins:/usr/local/nagios/libexec/custom:ro
      - nagios_data:/var/nagios
      - nagios_logs:/var/log/nagios
    networks:
      - secure-vault-network-monitoring
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - database
      - redis
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nagios/cgi-bin/statusmap.cgi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  nagios_data:
    driver: local
  nagios_logs:
    driver: local

networks:
  secure-vault-network:
    driver: bridge
  secure-vault-network-monitoring:
    driver: bridge
