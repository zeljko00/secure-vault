services:
  database:
    image: postgres:16-alpine
    container_name: secure-vault-db
    env_file:
      - ./database/.env
    volumes:
      # PostgreSQL data persistence
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secure-vault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./secure-vault-backend
      dockerfile: Dockerfile
    image: secure-vault-backend:local
    container_name: secure-vault-backend
    # Optionally override the default command to run the Django server
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./secure-vault-backend/.env
    ports:
      - "8080:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - secure-vault-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  secure-vault-network:
    driver: bridge
