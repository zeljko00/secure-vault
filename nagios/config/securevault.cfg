# SecureVault Service Monitoring Configuration

# ========================================
# HOSTS
# ========================================

define host{
    use                     linux-server
    host_name               securevault-backend
    alias                   SecureVault Backend API
    address                 backend
    check_interval          5
    retry_interval          1
}

define host{
    use                     linux-server
    host_name               securevault-frontend
    alias                   SecureVault Frontend
    address                 frontend
    check_interval          5
    retry_interval          1
}

define host{
    use                     linux-server
    host_name               securevault-db
    alias                   PostgreSQL Database
    address                 database
    check_interval          5
    retry_interval          1
}

define host{
    use                     linux-server
    host_name               securevault-redis
    alias                   Redis Cache
    address                 redis
    check_interval          5
    retry_interval          1
}

define host{
    use                     linux-server
    host_name               securevault-proxy
    alias                   Nginx Proxy
    address                 proxy
    check_interval          5
    retry_interval          1
}

define host{
    use                     linux-server
    host_name               securevault-api-gateway
    alias                   APISIX API Gateway
    address                 api-gateway
    check_interval          5
    retry_interval          1
}

# ========================================
# SERVICES - BACKEND
# ========================================

define service{
    use                     rw-service
    host_name               securevault-backend
    service_description     Backend API TCP Port
    check_command           check_tcp_port!8000
    check_interval          1
    retry_interval          1
}

define service{
    use                     rw-service
    host_name               securevault-backend
    service_description     Backend HTTP Health Check
    check_command           check_django_health!8000
    check_interval          2
    retry_interval          1
}

define service{
    use                     rw-service
    host_name               securevault-backend
    service_description     Backend Response Time
    check_command           check_http_path_response_time!8000!/api/diagnostics/health/ready/!1!3
    check_interval          3
    retry_interval          1
}

# ========================================
# SERVICES - FRONTEND
# ========================================

define service{
    use                     rw-service
    host_name               securevault-frontend
    service_description     Frontend Dev Server Port
    check_command           check_tcp_port!5173
    check_interval          1
    retry_interval          1
}

define service{
    use                     rw-service
    host_name               securevault-frontend
    service_description     Frontend HTTP Response
    check_command           check_http_service_with_host_header!5173!2!5!localhost
    check_interval          2
    retry_interval          1
}

# ========================================
# SERVICES - DATABASE
# ========================================

define service{
    use                     rw-service
    host_name               securevault-db
    service_description     PostgreSQL Connection
    check_command           check_postgres
    check_interval          1
    retry_interval          1
}

define service{
    use                     rw-service
    host_name               securevault-db
    service_description     Database Ping
    check_command           check_ping
    check_interval          2
    retry_interval          1
}

# ========================================
