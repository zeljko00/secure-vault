# ========================================
# SERVICES - API GATEWAY (APISIX)
# ========================================

define service{
    use                     rw-service
    host_name               securevault-api-gateway
    service_description     API Gateway TCP Port
    check_command           check_tcp_port!9080
    check_interval          1
    retry_interval          1
}

define service{
    use                     rw-service
    host_name               securevault-api-gateway
