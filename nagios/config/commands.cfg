# Command definitions

define command{
    command_name    check_local_disk
    command_line    $USER1$/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

define command{
    command_name    check_local_load
    command_line    $USER1$/check_load -r -w $ARG1$ -c $ARG2$
}

define command{
    command_name    check_local_swap
    command_line    $USER1$/check_swap -n $ARG1$ -w $ARG2$ -c $ARG3$
}

define command{
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}

define command{
    command_name    check_http_service
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

define command{
    command_name    check_http_service_with_host_header
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -k 'Host: $ARG4$' -w $ARG2$ -c $ARG3$
}

define command{
    command_name    check_postgres
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 5432
}

define command{
    command_name    check_redis
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 6379
}

define command{
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 100,20% -c 200,50%
}

define command{
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 100.0,20% -c 500.0,60% -p 1
}

define command{
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "Service: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\nInfo: $SERVICEOUTPUT$\nDate: $LONGDATETIME$" | mail -s "Nagios Alert: $SERVICEDESC$ on $HOSTALIAS$ is $SERVICESTATE$" $CONTACTEMAIL$
}

define command{
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "Host: $HOSTALIAS$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\nDate: $LONGDATETIME$" | mail -s "Nagios Alert: $HOSTALIAS$ is $HOSTSTATE$" $CONTACTEMAIL$
}

define command{
    command_name    check_django_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u /api/diagnostics/health/ready/ -w 2 -c 5
}

define command{
    command_name    check_service_response_time
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

define command{
    command_name    check_http_path_response_time
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -w $ARG3$ -c $ARG4$
}

define command{
    command_name    process-service-perfdata
    command_line    /bin/mv /var/nagios/service-perfdata /var/nagios/service-perfdata.$TIMET$ && /bin/gzip /var/nagios/service-perfdata.$TIMET$
}

define command{
    command_name    process-host-perfdata
    command_line    /bin/mv /var/nagios/host-perfdata /var/nagios/host-perfdata.$TIMET$ && /bin/gzip /var/nagios/host-perfdata.$TIMET$
}

define command{
    command_name    process-service-perfdata-file
    command_line    /bin/find /var/nagios -name "service-perfdata*" -mtime +7 -exec rm {} \;
}

define command{
    command_name    process-host-perfdata-file
    command_line    /bin/find /var/nagios -name "host-perfdata*" -mtime +7 -exec rm {} \;
}
